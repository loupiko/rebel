<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e6ebe6">
<title>Rebelle — Le voyage temporel</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #e9ede8;
    background-image: linear-gradient(180deg, #f7f8f5 0%, #e6ebe6 50%, #d3ddd5 100%);
    color: #111; height: 100dvh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  #head { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; }
  #title { width: min(78vw, 400px); height: auto; display: block; }
  #subtitle { width: min(80vw, 420px); height: auto; display: block; }

  #clockWrap { position: relative; flex: 0 1 auto; width: min(92vw, 52dvh, 480px); aspect-ratio: 1; margin: auto 0; }
  #clockImg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hands { position: absolute; inset: 0; width: 100%; height: 100%; }

  #counter {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 5px; padding: 8px 10px; border-radius: 12px;
    background: #14110f; box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 3px 0 #000, 0 8px 16px rgba(0,0,0,.35);
    border: 3px solid #2b2521;
  }
  .reel { width: var(--rw); height: var(--rh); overflow: hidden; border-radius: 7px; background: #0a0908; box-shadow: inset 0 0 12px rgba(0,0,0,.9); position: relative; }
  .reel::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.7), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.7)); }
  .strip { will-change: transform; }
  .digit { height: var(--rh); line-height: var(--rh); text-align: center; font-family: "Courier New", Menlo, monospace; font-weight: 700; font-size: calc(var(--rh) * .7);
    color: #ff3d1f; text-shadow: 0 0 6px rgba(255,61,31,.85), 0 0 18px rgba(255,90,40,.45); }
  :root { --rw: clamp(34px, 9.5vw, 50px); --rh: clamp(52px, 13.5vw, 72px); }

  #go {
    flex: 0 0 auto; width: min(72vw, 340px); height: clamp(60px, 9dvh, 78px); border: 0; border-radius: 16px; cursor: pointer;
    background: linear-gradient(180deg, #ff5f52 0%, #e8261b 55%, #c4130c 100%);
    box-shadow: 0 8px 0 #7a0a06, 0 12px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.2);
    color: #fff; font-family: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive; font-size: clamp(24px, 7vw, 34px); letter-spacing: .04em;
    text-shadow: 0 2px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s; animation: pulse 1.8s ease-in-out infinite;
  }
  #go:active, #go.pressed { transform: translateY(6px); box-shadow: 0 2px 0 #7a0a06, 0 5px 8px rgba(0,0,0,.3), inset 0 -3px 6px rgba(0,0,0,.3); animation: none; }
  #go:disabled { animation: none; filter: saturate(.55) brightness(.8); cursor: default; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }

  #screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .9s ease; z-index: 10; }
  #screen.on { opacity: 1; pointer-events: auto; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #sound, #close { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-size: 16px; background: rgba(255,255,255,.92); color: #000; }
  #sound { left: 16px; display: none; }
  #close { right: 16px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .25s; }
  #flash.on { opacity: 1; }

  @media (max-height: 700px) {
    #title { width: min(64vw, 320px); } #subtitle { width: min(70vw, 340px); } #head { gap: 4px; }
    #clockWrap { width: min(80vw, 46dvh); } :root { --rw: 32px; --rh: 48px; }
    #go { height: 56px; font-size: 24px; }
  }
</style>
</head>

<script>
(function () {
  var db = {}, years = [], busy = false;
  var go = document.getElementById('go');
  var hHour = document.getElementById('hHour'), hMin = document.getElementById('hMin');
  var screen = document.getElementById('screen');
  var video = document.getElementById('video');
  var soundBtn = document.getElementById('sound');
  var closeBtn = document.getElementById('close');
  var flash = document.getElementById('flash');
  var reels = [0,1,2,3].map(function (i) { return document.getElementById('r' + i); });

  /* ---------- son mécanique (WebAudio, généré, aucun fichier) ---------- */
  var actx = null, noiseBuf = null;
  function audioInit() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        var len = Math.floor(actx.sampleRate * 0.05);
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tick(strength) {
    if (!actx) return;
    var t = actx.currentTime;
    // claquement : bruit filtré + petit "toc" grave
    var src = actx.createBufferSource(); src.buffer = noiseBuf;
    var bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200 + Math.random() * 600; bp.Q.value = 1.2;
    var g = actx.createGain(); g.gain.setValueAtTime(0.35 * strength, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t); src.stop(t + 0.05);
    var o = actx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.03);
    var g2 = actx.createGain(); g2.gain.setValueAtTime(0.12 * strength, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
    o.connect(g2); g2.connect(actx.destination); o.start(t); o.stop(t + 0.04);
  }

  /* ---------- aiguilles : rotation continue dans le sens horaire ---------- */
  var minDeg = 60, hourDeg = 305, spinning = false, spinStart = 0, spinEnd = 0, lastT = 0;
  var MIN_SPEED = 1080; // deg/s à pleine vitesse (3 tours/s), l'aiguille des heures = 1/12
  function setHands() {
    hMin.setAttribute('transform', 'rotate(' + (minDeg % 360) + ' 50 50)');
    hHour.setAttribute('transform', 'rotate(' + (hourDeg % 360) + ' 50 50)');
  }
  function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function handsFrame(now) {
    if (!spinning) return;
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    var el = now - spinStart, rem = spinEnd - now, f = 1;
    if (el < 500) f = ease(el / 500);
    if (rem < 1200) f = Math.min(f, ease(Math.max(0, rem) / 1200));
    minDeg += MIN_SPEED * f * dt; hourDeg += (MIN_SPEED / 12) * f * dt;
    setHands();
    if (now >= spinEnd) { spinning = false; return; }
    requestAnimationFrame(handsFrame);
  }
  function spinHands(durationMs) {
    spinning = true; spinStart = lastT = performance.now(); spinEnd = spinStart + durationMs;
    requestAnimationFrame(handsFrame);
  }

  /* ---------- rouleaux ---------- */
  function digitH() { return reels[0].firstChild ? reels[0].firstChild.getBoundingClientRect().height : 60; }
  function buildReel(strip, finalDigit, turns) {
    var html = '';
    for (var t = 0; t < turns; t++) for (var d = 0; d < 10; d++) html += '<div class="digit">' + d + '</div>';
    for (var d2 = 0; d2 <= finalDigit; d2++) html += '<div class="digit">' + d2 + '</div>';
    strip.innerHTML = html; strip.style.transform = 'translateY(0)';
    return turns * 10 + finalDigit;
  }
  function showStatic(yearStr) {
    reels.forEach(function (s, i) { s.innerHTML = '<div class="digit">' + yearStr[i] + '</div>'; s.style.transform = 'translateY(0)'; });
  }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3.2); }
  function spinTo(yearStr, done) {
    var h = digitH();
    var steps = reels.map(function (s, i) { return buildReel(s, +yearStr[i], 3 + i); });
    var durs = [2600, 3100, 3600, 4100];
    var t0 = performance.now(), lastStep = [0, 0, 0, 0], finished = 0;
    spinHands(4300);
    function frame(now) {
      var el = now - t0;
      for (var i = 0; i < 4; i++) {
        var p = Math.min(1, el / durs[i]);
        var pos = steps[i] * easeOut(p);
        reels[i].style.transform = 'translateY(' + (-pos * h) + 'px)';
        var st = Math.floor(pos);
        if (st !== lastStep[i]) { lastStep[i] = st; tick(0.6 + 0.4 * (1 - p)); }
        if (p >= 1 && !reels[i].done) { reels[i].done = true; finished++; tick(1); }
      }
      if (finished < 4) requestAnimationFrame(frame); else setTimeout(done, 250);
    }
    reels.forEach(function (r) { r.done = false; });
    requestAnimationFrame(frame);
  }

  /* ---------- séquence ---------- */
  function pickYear() { return years[Math.floor(Math.random() * years.length)]; }
  function launch() {
    if (busy || !years.length) return;
    busy = true; go.disabled = true; go.classList.add('pressed');
    audioInit();
    var year = pickYear();
    video.muted = false; video.src = db[year]; video.load();
    var warm = video.play();
    if (warm && warm.then) warm.then(function () { video.pause(); video.currentTime = 0; }).catch(function () {});
    spinTo(year, function () {
      setTimeout(function () {
        flash.classList.add('on');
        setTimeout(function () {
          screen.classList.add('on'); flash.classList.remove('on');
          video.currentTime = 0;
          var p = video.play();
          if (p && p.catch) p.catch(function () { video.muted = true; soundBtn.style.display = 'block'; video.play().catch(function () {}); });
        }, 260);
      }, 500);
    });
  }
  function back() {
    screen.classList.remove('on');
    setTimeout(function () { video.pause(); video.removeAttribute('src'); video.load(); }, 900);
    soundBtn.style.display = 'none';
    go.disabled = false; go.classList.remove('pressed'); busy = false;
  }

  go.addEventListener('click', launch);
  video.addEventListener('ended', back);
  closeBtn.addEventListener('click', back);
  soundBtn.addEventListener('click', function () { video.muted = false; video.play(); soundBtn.style.display = 'none'; });

  setHands();
  showStatic('2026');

  fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      db = {};
      Object.keys(data || {}).forEach(function (k) {
        var y = String(k).trim(), f = data[k];
        if (/^\d{4}$/.test(y) && +y >= 1986 && +y <= 2026 && typeof f === 'string' && f) db[y] = f;
      });
      years = Object.keys(db).sort();
      if (!years.length) go.disabled = true;
    })
    .catch(function () { go.disabled = true; });
})();
</script>
</body>
