<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#e6ebe6">
<title>Rebelle — Le voyage temporel</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #e9ede8;
    background-image: linear-gradient(180deg, #f7f8f5 0%, #e6ebe6 50%, #d3ddd5 100%);
    color: #111; height: 100dvh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  .marker { font-family: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive; }
  #head { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 0 0 auto; }
  #title { width: min(78vw, 400px); height: auto; display: block; }
  #subtitle { width: min(80vw, 420px); height: auto; display: block; }

  #clockWrap { position: relative; flex: 0 1 auto; width: min(92vw, 46dvh, 480px); aspect-ratio: 1; margin: auto 0 0; }
  #clockImg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hands { position: absolute; inset: 0; width: 100%; height: 100%; }

  #counter {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 5px; padding: 8px 10px; border-radius: 12px;
    background: #14110f; box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 3px 0 #000, 0 8px 16px rgba(0,0,0,.35);
    border: 3px solid #2b2521;
  }
  .reel { width: var(--rw); height: var(--rh); overflow: hidden; border-radius: 7px; background: #0a0908; box-shadow: inset 0 0 12px rgba(0,0,0,.9); position: relative; }
  .reel::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.7), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.7)); }
  .strip { will-change: transform; }
  .digit { height: var(--rh); line-height: var(--rh); text-align: center; font-family: "Courier New", Menlo, monospace; font-weight: 700; font-size: calc(var(--rh) * .7);
    color: #ff3d1f; text-shadow: 0 0 6px rgba(255,61,31,.85), 0 0 18px rgba(255,90,40,.45); }
  :root { --rw: clamp(34px, 9.5vw, 50px); --rh: clamp(52px, 13.5vw, 72px); }

  /* jauge de série */
  #gauge { flex: 0 0 auto; width: min(80vw, 360px); margin: 10px 0 auto; text-align: center; }
  #gaugeTxt { font-size: clamp(15px, 4.2vw, 19px); color: #2a2a2a; letter-spacing: .02em; margin-bottom: 6px; }
  #gaugeTxt b { color: #c4130c; font-size: 1.25em; }
  #bar { height: 14px; border-radius: 999px; background: #c8d0c9; box-shadow: inset 0 2px 4px rgba(0,0,0,.25); overflow: hidden; border: 2px solid #9aa79e; }
  #fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(180deg, #ff5f52, #c4130c); transition: width .7s cubic-bezier(.2,.9,.3,1.2); }
  #galleryLink { display: inline-block; margin-top: 8px; font-size: 13px; color: #555; text-decoration: underline; cursor: pointer; }

  .btn {
    flex: 0 0 auto; width: min(72vw, 340px); height: clamp(58px, 8.5dvh, 76px); border: 0; border-radius: 16px; cursor: pointer;
    background: linear-gradient(180deg, #ff5f52 0%, #e8261b 55%, #c4130c 100%);
    box-shadow: 0 8px 0 #7a0a06, 0 12px 18px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.2);
    color: #fff; font-family: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive; font-size: clamp(24px, 7vw, 34px); letter-spacing: .04em;
    text-shadow: 0 2px 0 rgba(0,0,0,.35); transition: transform .08s, box-shadow .08s;
  }
  .btn:active, .btn.pressed { transform: translateY(6px); box-shadow: 0 2px 0 #7a0a06, 0 5px 8px rgba(0,0,0,.3), inset 0 -3px 6px rgba(0,0,0,.3); animation: none; }
  .btn:disabled { animation: none; filter: saturate(.55) brightness(.8); cursor: default; }
  #go { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .btn.small { width: auto; min-width: 160px; height: 52px; font-size: 22px; padding: 0 22px; border-radius: 13px; box-shadow: 0 5px 0 #7a0a06, 0 8px 12px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.35); }
  .btn.grey { background: linear-gradient(180deg, #8f9aa8, #5f6b7d 60%, #46505e); box-shadow: 0 5px 0 #2d3540, 0 8px 12px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.3); }

  /* écrans superposés */
  .layer { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .8s ease; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .layer.on { opacity: 1; pointer-events: auto; }
  #screen { background: #000; z-index: 12; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #sound { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 16px; border: 0; border-radius: 999px; padding: 12px 18px; font: inherit; font-size: 16px; background: rgba(255,255,255,.92); color: #000; display: none; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 20; transition: opacity .25s; }
  #flash.on { opacity: 1; }

  #guess { background: #e9ede8; background-image: linear-gradient(180deg, #f7f8f5 0%, #e6ebe6 50%, #d3ddd5 100%); padding: 20px 16px max(22px, env(safe-area-inset-bottom)); gap: clamp(10px, 2.5dvh, 22px); }
  #guess h2 { margin: 0; font-size: clamp(30px, 9vw, 44px); color: #1a1a1a; text-align: center; line-height: 1.05; }
  #guess p.hint { margin: 0; font-size: 15px; color: #444; text-align: center; }
  #pick { display: inline-flex; gap: 5px; padding: 8px 10px; border-radius: 12px; background: #14110f; border: 3px solid #2b2521; box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 3px 0 #000, 0 8px 16px rgba(0,0,0,.35); }
  #pick .reel { width: var(--rw); }
  #sliderRow { display: flex; align-items: center; gap: 10px; width: min(92vw, 420px); }
  .pm { width: 54px; height: 54px; border-radius: 50%; border: 0; background: #1a1a1a; color: #fff; font-size: 34px; line-height: 54px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 0 #000, 0 6px 10px rgba(0,0,0,.3); flex: 0 0 auto; }
  .pm:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  input[type=range] { flex: 1 1 auto; -webkit-appearance: none; appearance: none; height: 44px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 999px; background: #1a1a1a; box-shadow: inset 0 2px 4px rgba(0,0,0,.6); }
  input[type=range]::-moz-range-track { height: 12px; border-radius: 999px; background: #1a1a1a; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 38px; height: 38px; border-radius: 50%; margin-top: -13px; background: linear-gradient(180deg, #ff5f52, #c4130c); border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.4); }
  input[type=range]::-moz-range-thumb { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #ff5f52, #c4130c); border: 3px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.4); }
  #ends { display: flex; justify-content: space-between; width: min(92vw, 420px); padding: 0 66px; font-size: 13px; color: #666; margin-top: -8px; }
  #guessBtns { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  #result { background: rgba(233,237,232,.97); padding: 20px 16px; gap: 14px; }
  #result h2 { margin: 0; font-size: clamp(34px, 10vw, 52px); text-align: center; line-height: 1.05; }
  #result h2.ok { color: #1b7f3a; } #result h2.ko { color: #c4130c; }
  #result p { margin: 0; font-size: clamp(17px, 4.6vw, 22px); color: #222; text-align: center; }
  #result p b { color: #c4130c; }

  /* animation succès : tête + clin d'œil + pouce */
  #win { position: relative; width: min(78vw, 330px); aspect-ratio: 330 / 260; }
  #winHead { position: absolute; left: 0; top: 0; width: 66%; height: auto; transform-origin: 50% 90%; }
  #winLid { position: absolute; left: 0; top: 0; width: 66%; height: auto; transform-origin: 73.75% 58.5%; transform: scaleY(0); }
  #winThumb { position: absolute; right: 0; bottom: 0; width: 42%; height: auto; transform-origin: 50% 100%; transform: translate(60%, 60%) rotate(35deg); }
  #result.on.ok #winHead { animation: pop .55s cubic-bezier(.2,1.4,.4,1) both; }
  #result.on.ok #winLid { animation: wink 2.4s ease-in-out .5s both; }
  #result.on.ok #winThumb { animation: thumb .7s cubic-bezier(.2,1.3,.4,1) .35s both; }
  @keyframes pop { 0% { transform: scale(.3) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes wink { 0%, 12% { transform: scaleY(0); } 20%, 52% { transform: scaleY(1); } 60%, 100% { transform: scaleY(0); } }
  @keyframes thumb { 0% { transform: translate(60%, 60%) rotate(35deg); } 100% { transform: translate(0, 0) rotate(-6deg); } }
  #result.on.ko #ko { animation: shake .6s ease both; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-14px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(6px); } }
  #ko { font-size: clamp(64px, 22vw, 110px); line-height: 1; }

  #reward { background: #000; color: #fff; z-index: 12; padding: 20px; gap: 16px; }
  #rvideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #rewardMsg { position: relative; z-index: 2; text-align: center; }
  #rewardMsg h2 { margin: 0 0 8px; font-size: clamp(32px, 9vw, 48px); color: #ffcf3f; text-shadow: 0 3px 0 #7a4a00; }
  #rewardMsg p { margin: 0 0 18px; font-size: 18px; color: #ddd; }
  #rewardBtn { position: relative; z-index: 2; }

  #gallery { background: #e9ede8; padding: 24px 16px; gap: 10px; justify-content: flex-start; overflow: auto; }
  #gallery h2 { margin: 6px 0 4px; font-size: 30px; }
  #gallery ul { list-style: none; padding: 0; margin: 0; width: min(92vw, 420px); }
  #gallery li { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; margin: 6px 0; background: #fff; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,.12); font-size: 17px; }
  #gallery li.locked { opacity: .45; }
  #gallery li button { border: 0; background: #1a1a1a; color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; }
  #gallery .foot { margin-top: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #reset { border: 0; background: none; color: #999; text-decoration: underline; font-size: 13px; }

  @media (max-height: 700px) {
    #title { width: min(64vw, 320px); } #subtitle { width: min(70vw, 340px); } #head { gap: 4px; }
    #clockWrap { width: min(78vw, 40dvh); } :root { --rw: 32px; --rh: 48px; }
    .btn { height: 54px; font-size: 24px; } #gauge { margin-top: 6px; } #gaugeTxt { margin-bottom: 4px; }
  }
</style>
</head>

          <path d="M62 122 Q88 118 112 122" fill="none" stroke-width="5"/>
          <path d="M62 148 Q88 144 111 148" fill="none" stroke-width="5"/>
          <path d="M46 100 Q30 78 40 48 Q46 24 66 22 Q88 21 86 46 Q84 72 76 98 Z"/>
          <path d="M54 44 Q64 34 76 42" fill="none" stroke-width="5"/>
        </g>
      </svg>
    </div>
    <div id="ko" aria-hidden="true">✖</div>
    <h2 id="resTitle" class="marker"></h2>
    <p id="resText"></p>
    <button id="resBtn" class="btn small" type="button">CONTINUER</button>
  </div>

  <div id="reward" class="layer">
    <video id="rvideo" playsinline preload="auto"></video>
    <div id="rewardMsg"><h2 class="marker" id="rewardTitle">NIVEAU 2 !</h2><p id="rewardText">Le Rebelle évolue…</p></div>
    <button id="rewardBtn" class="btn small" type="button">CONTINUER</button>
  </div>

  <div id="gallery" class="layer">
    <h2 class="marker">ÉVOLUTIONS</h2>
    <ul id="galList"></ul>
    <div class="foot">
      <button id="galClose" class="btn small" type="button">RETOUR</button>
      <button id="reset" type="button">Recommencer à zéro</button>
    </div>
  </div>

<script>
(function () {
  var TIERS = [2, 5, 10, 20];
  var MINY = 1986, MAXY = 2026;
  var db = {}, years = [], rewards = {}, busy = false, current = null;
  var $ = function (id) { return document.getElementById(id); };
  var go = $('go'), hHour = $('hHour'), hMin = $('hMin');
  var screen = $('screen'), video = $('video'), soundBtn = $('sound'), flash = $('flash');
  var guess = $('guess'), slider = $('slider'), result = $('result'), reward = $('reward'), rvideo = $('rvideo');
  var reels = [0,1,2,3].map(function (i) { return $('r' + i); });
  var picks = [0,1,2,3].map(function (i) { return $('p' + i); });

  /* ---------- état persistant ---------- */
  var state = { streak: 0, done: [], unlocked: [], lastGuess: 2006, plays: 0 };
  function load() {
    try { var s = JSON.parse(localStorage.getItem('rebel.v2') || 'null'); if (s && typeof s === 'object') { state.streak = +s.streak || 0; state.done = s.done || []; state.unlocked = s.unlocked || []; state.lastGuess = +s.lastGuess || 2006; state.plays = +s.plays || 0; } } catch (e) {}
  }
  function save() { try { localStorage.setItem('rebel.v2', JSON.stringify(state)); } catch (e) {} }
  function nextTier() { for (var i = 0; i < TIERS.length; i++) if (state.streak < TIERS[i]) return TIERS[i]; return null; }
  function prevTier() { var p = 0; for (var i = 0; i < TIERS.length; i++) if (state.streak >= TIERS[i]) p = TIERS[i]; return p; }
  function renderGauge() {
    var n = nextTier();
    $('gStreak').textContent = state.streak;
    $('gNext').textContent = n === null ? 'légende !' : n;
    var pct = n === null ? 100 : Math.round(100 * state.streak / n);
    $('fill').style.width = pct + '%';
    $('gCount').textContent = state.unlocked.length;
  }

  /* ---------- son mécanique ---------- */
  var actx = null, noiseBuf = null;
  function audioInit() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        var len = Math.floor(actx.sampleRate * 0.05);
        noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
        var d = noiseBuf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function tick(strength) {
    if (!actx) return;
    var t = actx.currentTime;
    var src = actx.createBufferSource(); src.buffer = noiseBuf;
    var bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2200 + Math.random() * 600; bp.Q.value = 1.2;
    var g = actx.createGain(); g.gain.setValueAtTime(0.35 * strength, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    src.connect(bp); bp.connect(g); g.connect(actx.destination); src.start(t); src.stop(t + 0.05);
    var o = actx.createOscillator(); o.type = 'square'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.03);
    var g2 = actx.createGain(); g2.gain.setValueAtTime(0.12 * strength, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
    o.connect(g2); g2.connect(actx.destination); o.start(t); o.stop(t + 0.04);
  }
  function ding(ok) {
    if (!actx) return;
    var t = actx.currentTime, notes = ok ? [523, 659, 784, 1047] : [330, 262];
    notes.forEach(function (f, i) {
      var o = actx.createOscillator(); o.type = ok ? 'triangle' : 'sawtooth'; o.frequency.value = f;
      var g = actx.createGain(); g.gain.setValueAtTime(0.0001, t + i * 0.12); g.gain.exponentialRampToValueAtTime(0.25, t + i * 0.12 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.12 + (ok ? 0.25 : 0.4));
      o.connect(g); g.connect(actx.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.5);
    });
  }

  /* ---------- aiguilles ---------- */
  var minDeg = 60, hourDeg = 305, spinning = false, spinStart = 0, spinEnd = 0, lastT = 0;
  var MIN_SPEED = 1080;
  function setHands() {
    hMin.setAttribute('transform', 'rotate(' + (minDeg % 360) + ' 50 50)');
    hHour.setAttribute('transform', 'rotate(' + (hourDeg % 360) + ' 50 50)');
  }
  function ease(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function handsFrame(now) {
    if (!spinning) return;
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    var el = now - spinStart, rem = spinEnd - now, f = 1;
    if (el < 500) f = ease(el / 500);
    if (rem < 1200) f = Math.min(f, ease(Math.max(0, rem) / 1200));
    minDeg += MIN_SPEED * f * dt; hourDeg += (MIN_SPEED / 12) * f * dt;
    setHands();
    if (now >= spinEnd) { spinning = false; return; }
    requestAnimationFrame(handsFrame);
  }
  function spinHands(durationMs) {
    spinning = true; spinStart = lastT = performance.now(); spinEnd = spinStart + durationMs;
    requestAnimationFrame(handsFrame);
  }

  /* ---------- rouleaux (s'arrêtent sur ????) ---------- */
  function digitH() { return reels[0].firstChild ? reels[0].firstChild.getBoundingClientRect().height : 60; }
  function buildReel(strip, turns) {
    var html = '';
    for (var t = 0; t < turns; t++) for (var d = 0; d < 10; d++) html += '<div class="digit">' + d + '</div>';
    html += '<div class="digit">?</div>';
    strip.innerHTML = html; strip.style.transform = 'translateY(0)';
    return turns * 10;
  }
  function showStatic(str) {
    reels.forEach(function (s, i) { s.innerHTML = '<div class="digit">' + str[i] + '</div>'; s.style.transform = 'translateY(0)'; });
  }
  function easeOut(x) { return 1 - Math.pow(1 - x, 3.2); }
  function spinReels(done) {
    var h = digitH();
    var steps = reels.map(function (s, i) { return buildReel(s, 3 + i); });
    var durs = [2600, 3100, 3600, 4100];
    var t0 = performance.now(), lastStep = [0, 0, 0, 0], finished = 0;
    spinHands(4300);
    function frame(now) {
      var el = now - t0;
      for (var i = 0; i < 4; i++) {
        var p = Math.min(1, el / durs[i]);
        var pos = steps[i] * easeOut(p);
        reels[i].style.transform = 'translateY(' + (-pos * h) + 'px)';
        var st = Math.floor(pos);
        if (st !== lastStep[i]) { lastStep[i] = st; tick(0.6 + 0.4 * (1 - p)); }
        if (p >= 1 && !reels[i].done) { reels[i].done = true; finished++; tick(1); }
      }
      if (finished < 4) requestAnimationFrame(frame); else setTimeout(done, 250);
    }
    reels.forEach(function (r) { r.done = false; });
    requestAnimationFrame(frame);
  }

  /* ---------- tirage ---------- */
  function pickYear() {
    var pool = years.filter(function (y) { return state.done.indexOf(y) < 0; });
    if (!pool.length) { state.done = []; pool = years.slice(); }
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function fileOf(y) { var v = db[y]; return typeof v === 'string' ? v : v.file; }

  function playVideo() {
    screen.classList.add('on');
    video.currentTime = 0;
    var p = video.play();
    if (p && p.catch) p.catch(function () { video.muted = true; soundBtn.style.display = 'block'; video.play().catch(function () {}); });
  }
  function launch() {
    if (busy || !years.length) return;
    busy = true; go.disabled = true; go.classList.add('pressed');
    audioInit();
    current = pickYear();
    video.muted = false; video.src = fileOf(current); video.load();
    var warm = video.play(); video.pause(); video.currentTime = 0;
    if (warm && warm.catch) warm.catch(function () {});
    spinReels(function () {
      setTimeout(function () {
        flash.classList.add('on');
        setTimeout(function () { flash.classList.remove('on'); playVideo(); }, 260);
      }, 500);
    });
  }

  /* ---------- devinette ---------- */
  function setPick(y) {
    y = Math.max(MINY, Math.min(MAXY, y | 0));
    slider.value = y; var s = String(y);
    picks.forEach(function (d, i) { d.textContent = s[i]; });
  }
  function openGuess() {
    screen.classList.remove('on');
    setPick(state.lastGuess || 2006);
    guess.classList.add('on');
  }
  slider.addEventListener('input', function () { setPick(+slider.value); tick(0.5); });
  $('minus').addEventListener('click', function () { setPick(+slider.value - 1); tick(0.7); });
  $('plus').addEventListener('click', function () { setPick(+slider.value + 1); tick(0.7); });
  $('replay').addEventListener('click', function () { guess.classList.remove('on'); playVideo(); });

  var pendingTier = null;
  $('validate').addEventListener('click', function () {
    var y = +slider.value; state.lastGuess = y; state.plays++;
    var ok = String(y) === String(current);
    guess.classList.remove('on');
    result.classList.remove('ok', 'ko');
    if (ok) {
      state.streak++; if (state.done.indexOf(current) < 0) state.done.push(current);
      pendingTier = null;
      for (var i = 0; i < TIERS.length; i++) if (state.streak === TIERS[i] && state.unlocked.indexOf(TIERS[i]) < 0) { state.unlocked.push(TIERS[i]); pendingTier = TIERS[i]; }
      $('resTitle').className = 'marker ok'; $('resTitle').textContent = current + ', EXACT !';
      $('resText').innerHTML = 'Série : <b>' + state.streak + '</b>' + (pendingTier ? ' — palier ' + pendingTier + ' atteint !' : (nextTier() ? ' · encore ' + (nextTier() - state.streak) + ' pour le palier ' + nextTier() : ' · légende !'));
      result.classList.add('ok'); $('win').style.display = 'block'; $('ko').style.display = 'none';
    } else {
      var diff = Math.abs(y - current);
      state.streak = 0; state.done = []; pendingTier = null;
      $('resTitle').className = 'marker ko'; $('resTitle').textContent = 'RATÉ !';
      $('resText').innerHTML = "C'était <b>" + current + '</b>' + (diff === 1 ? ' — à un an près !' : '') + '<br>Série remise à zéro.';
      result.classList.add('ko'); $('win').style.display = 'none'; $('ko').style.display = 'block';
    }
    save(); renderGauge();
    result.classList.add('on'); ding(ok);
    setTimeout(function () { video.pause(); video.removeAttribute('src'); video.load(); }, 900);
  });

  function home() {
    result.classList.remove('on'); reward.classList.remove('on'); guess.classList.remove('on');
    soundBtn.style.display = 'none';
    setTimeout(function () { rvideo.pause(); rvideo.removeAttribute('src'); rvideo.load(); }, 900);
    showStatic('????');
    go.disabled = false; go.classList.remove('pressed'); busy = false; current = null;
  }
  function showReward(tier, fromGallery) {
    $('rewardTitle').textContent = 'NIVEAU ' + tier + ' !';
    var f = rewards[String(tier)];
    if (f) {
      $('rewardText').textContent = fromGallery ? '' : 'Le Rebelle évolue…';
      rvideo.muted = false; rvideo.src = f; rvideo.load();
      reward.classList.add('on');
      var p = rvideo.play(); if (p && p.catch) p.catch(function () { rvideo.muted = true; rvideo.play().catch(function () {}); });
    } else {
      $('rewardText').textContent = 'Récompense débloquée ! La vidéo de cette évolution arrive bientôt…';
      reward.classList.add('on');
    }
    $('rewardBtn').onclick = fromGallery ? function () { reward.classList.remove('on'); setTimeout(function () { rvideo.pause(); rvideo.removeAttribute('src'); rvideo.load(); }, 900); } : home;
  }
  $('resBtn').addEventListener('click', function () {
    if (pendingTier) { result.classList.remove('on'); showReward(pendingTier, false); pendingTier = null; }
    else home();
  });
  rvideo.addEventListener('error', function () { $('rewardText').textContent = 'Récompense débloquée ! La vidéo de cette évolution arrive bientôt…'; });

  /* ---------- galerie ---------- */
  function openGallery() {
    var ul = $('galList'); ul.innerHTML = '';
    TIERS.forEach(function (t) {
      var li = document.createElement('li'); var got = state.unlocked.indexOf(t) >= 0;
      li.className = got ? '' : 'locked';
      li.innerHTML = '<span>Niveau ' + t + ' — série de ' + t + '</span>';
      if (got) { var b = document.createElement('button'); b.textContent = rewards[String(t)] ? 'Voir' : 'Bientôt'; b.onclick = function () { showReward(t, true); }; li.appendChild(b); }
      else { var s = document.createElement('span'); s.textContent = '🔒'; li.appendChild(s); }
      ul.appendChild(li);
    });
    $('gallery').classList.add('on');
  }
  $('galleryLink').addEventListener('click', function () { if (!busy) openGallery(); });
  $('galClose').addEventListener('click', function () { $('gallery').classList.remove('on'); });
  $('reset').addEventListener('click', function () {
    if (!confirm('Tout remettre à zéro (série et évolutions) ?')) return;
    state = { streak: 0, done: [], unlocked: [], lastGuess: 2006, plays: 0 }; save(); renderGauge(); openGallery();
  });

  go.addEventListener('click', launch);
  video.addEventListener('ended', openGuess);
  soundBtn.addEventListener('click', function () { video.muted = false; video.play(); soundBtn.style.display = 'none'; });

  load(); renderGauge(); setHands(); showStatic('????');

  fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      db = {};
      Object.keys(data || {}).forEach(function (k) {
        var y = String(k).trim(), f = data[k];
        if (!/^\d{4}$/.test(y) || +y < MINY || +y > MAXY) return;
        if (typeof f === 'string' && f) db[y] = f; else if (f && typeof f.file === 'string' && f.file) db[y] = f;
      });
      years = Object.keys(db).sort();
      if (!years.length) go.disabled = true;
    })
    .catch(function () { go.disabled = true; });
  fetch('rewards.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (data) { rewards = data && typeof data === 'object' ? data : {}; })
    .catch(function () { rewards = {}; });
})();
</script>
