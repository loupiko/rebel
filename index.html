<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rebel</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; }
  video { max-width: 100vw; max-height: 100dvh; width: 100%; height: auto; background: #000; display: block; }
  #ui { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; gap: 12px; padding: 0 16px; }
  button { font: inherit; font-size: 17px; padding: 12px 20px; border: 0; border-radius: 999px; background: rgba(255,255,255,.92); color: #000; }
  #msg { padding: 32px; text-align: center; font-size: 18px; line-height: 1.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <video id="v" playsinline autoplay muted loop preload="auto" class="hidden"></video>
  <div id="msg" class="hidden"></div>
  <div id="ui" class="hidden">
    <button id="sound" type="button">🔊 Activer le son</button>
    <button id="next" type="button">🎲 Une autre</button>
  </div>
<script>
(function () {
  var v = document.getElementById('v');
  var msg = document.getElementById('msg');
  var ui = document.getElementById('ui');
  var soundBtn = document.getElementById('sound');
  var nextBtn = document.getElementById('next');
  var list = [];
  var current = -1;

  function show(text) { msg.textContent = text; msg.classList.remove('hidden'); }

  function pick() {
    if (!list.length) return;
    var i;
    do { i = Math.floor(Math.random() * list.length); } while (list.length > 1 && i === current);
    current = i;
    v.src = 'videos/' + encodeURIComponent(list[i]);
    v.classList.remove('hidden');
    ui.classList.remove('hidden');
    var p = v.play();
    if (p && p.catch) p.catch(function () { /* l'utilisateur touchera l'écran */ });
  }

  soundBtn.addEventListener('click', function () {
    v.muted = false;
    v.play();
    soundBtn.classList.add('hidden');
  });
  nextBtn.addEventListener('click', pick);
  v.addEventListener('click', function () { if (v.paused) v.play(); });

  fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      list = Array.isArray(data) ? data.filter(function (x) { return typeof x === 'string' && x; }) : [];
      if (!list.length) { show('Le personnage prépare son numéro… reviens bientôt !'); return; }
      pick();
    })
    .catch(function () { show('Le personnage prépare son numéro… reviens bientôt !'); });
})();
</script>
</body>
</html>
