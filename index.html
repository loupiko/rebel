<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#cfdad2">
<title>Rebelle — Le voyage temporel</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: #e9ede8;
    background-image: linear-gradient(180deg, #f6f7f4 0%, #e3e9e3 45%, #c9d6cb 100%);
    color: #111;
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
    user-select: none; -webkit-user-select: none;
  }
  #head { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 0 0 auto; }
  #title { width: min(86vw, 440px, 60dvh); height: auto; display: block; filter: drop-shadow(0 2px 0 rgba(0,0,0,.12)); }
  #subtitle { width: min(52vw, 260px); height: auto; display: block; margin-top: -2px; }

  #clockWrap { position: relative; flex: 0 1 auto; width: min(58vw, 34dvh, 300px); aspect-ratio: 1; margin: 2px 0; }
  #clockImg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hands { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hand { transform-origin: 50% 50%; }
  #hands.spinning #hHour { animation: spin 1.6s linear infinite; }
  #hands.spinning #hMin  { animation: spin 0.55s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #counter {
    display: flex; gap: 6px; padding: 10px 14px; border-radius: 14px;
    background: #14110f; box-shadow: inset 0 2px 8px rgba(0,0,0,.8), 0 3px 0 #000, 0 6px 14px rgba(0,0,0,.25);
    border: 3px solid #2b2521; flex: 0 0 auto;
  }
  .reel {
    width: clamp(38px, 11vw, 56px); height: clamp(58px, 15vw, 84px); overflow: hidden; border-radius: 8px;
    background: #0a0908; box-shadow: inset 0 0 12px rgba(0,0,0,.9); position: relative;
  }
  .reel::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.75)); }
  .strip { will-change: transform; }
  .digit {
    height: clamp(58px, 15vw, 84px); line-height: clamp(58px, 15vw, 84px); text-align: center;
    font-family: "Courier New", "Menlo", monospace; font-weight: 700; font-size: clamp(38px, 10vw, 58px);
    color: #ff3d1f; text-shadow: 0 0 6px rgba(255,61,31,.85), 0 0 18px rgba(255,90,40,.45);
  }

  #go {
    flex: 0 0 auto; margin-top: 4px;
    width: min(56vw, 22dvh, 190px); aspect-ratio: 1; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 38% 30%, #ff8a7a 0%, #e5261c 45%, #a70f0b 100%);
    box-shadow: 0 10px 0 #6d0705, 0 14px 22px rgba(0,0,0,.35), inset 0 -8px 16px rgba(0,0,0,.25), inset 0 6px 10px rgba(255,255,255,.35);
    color: #fff; font-weight: 900; font-size: clamp(15px, 4.4vw, 20px); letter-spacing: .06em; line-height: 1.15; text-transform: uppercase;
    text-shadow: 0 2px 0 rgba(0,0,0,.4);
    transition: transform .08s, box-shadow .08s;
    animation: pulse 1.8s ease-in-out infinite;
  }
  #go:active, #go.pressed { transform: translateY(8px); box-shadow: 0 2px 0 #6d0705, 0 6px 10px rgba(0,0,0,.3), inset 0 -4px 10px rgba(0,0,0,.3); animation: none; }
  #go:disabled { animation: none; filter: saturate(.6) brightness(.85); cursor: default; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  #ring { position: absolute; inset: -14px; border-radius: 50%; border: 6px solid #2b2b2b; box-shadow: 0 6px 0 #111; pointer-events: none; }
  #goWrap { position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  #hint { font-size: 13px; color: #333; opacity: .75; margin-top: 12px; text-align: center; min-height: 1.2em; }

  #screen {
    position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .9s ease; z-index: 10;
  }
  #screen.on { opacity: 1; pointer-events: auto; }
  #video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #sound, #close {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); border: 0; border-radius: 999px;
    padding: 12px 18px; font: inherit; font-size: 16px; background: rgba(255,255,255,.92); color: #000;
  }
  #sound { left: 16px; display: none; }
  #close { right: 16px; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; transition: opacity .25s; }
  #flash.on { opacity: 1; }

  @media (max-height: 700px) {
    #title { width: min(74vw, 360px); }
    #subtitle { width: min(40vw, 200px); }
    #clockWrap { width: min(44vw, 26dvh, 220px); }
    #go { width: min(44vw, 18dvh, 140px); font-size: 14px; }
    #counter { padding: 6px 10px; }
    #hint { margin-top: 6px; font-size: 12px; }
  }
</style>
</head>

<script>
(function () {
  var db = {};
  var years = [];
  var busy = false;
  var go = document.getElementById('go');
  var hint = document.getElementById('hint');
  var hands = document.getElementById('hands');
  var hHour = document.getElementById('hHour'), hMin = document.getElementById('hMin');
  var screen = document.getElementById('screen');
  var video = document.getElementById('video');
  var soundBtn = document.getElementById('sound');
  var closeBtn = document.getElementById('close');
  var flash = document.getElementById('flash');
  var reels = [0,1,2,3].map(function (i) { return document.getElementById('r' + i); });

  function digitH() { return reels[0].firstChild ? reels[0].firstChild.getBoundingClientRect().height : 60; }

  function buildReel(strip, finalDigit, turns) {
    var html = '';
    for (var t = 0; t < turns; t++) for (var d = 0; d < 10; d++) html += '<div class="digit">' + d + '</div>';
    for (var d2 = 0; d2 <= finalDigit; d2++) html += '<div class="digit">' + d2 + '</div>';
    strip.innerHTML = html;
    strip.style.transition = 'none';
    strip.style.transform = 'translateY(0)';
    return turns * 10 + finalDigit;
  }

  function showStatic(yearStr) {
    reels.forEach(function (s, i) { s.innerHTML = '<div class="digit">' + yearStr[i] + '</div>'; s.style.transition = 'none'; s.style.transform = 'translateY(0)'; });
  }

  function setHands(deg1, deg2) { hHour.style.transform = 'rotate(' + deg1 + 'deg)'; hMin.style.transform = 'rotate(' + deg2 + 'deg)'; }

  function pickYear() { return years[Math.floor(Math.random() * years.length)]; }

  function spinTo(yearStr, done) {
    var h = digitH();
    var idx = reels.map(function (s, i) { return buildReel(s, +yearStr[i], 3 + i); });
    void reels[0].offsetHeight;
    reels.forEach(function (s, i) {
      var dur = 2.6 + i * 0.5;
      s.style.transition = 'transform ' + dur + 's cubic-bezier(.12,.75,.15,1)';
      s.style.transform = 'translateY(' + (-idx[i] * h) + 'px)';
    });
    hands.classList.add('spinning');
    setTimeout(function () {
      hands.classList.remove('spinning');
      setHands(Math.random() * 360, Math.random() * 360);
      done();
    }, (2.6 + 3 * 0.5) * 1000 + 150);
  }

  function launch() {
    if (busy || !years.length) return;
    busy = true; go.disabled = true; go.classList.add('pressed');
    hint.textContent = 'Calcul de la destination…';
    var year = pickYear();
    video.muted = false;
    video.src = db[year];
    video.load();
    var warm = video.play();
    if (warm && warm.then) warm.then(function () { video.pause(); video.currentTime = 0; }).catch(function () {});
    spinTo(year, function () {
      hint.textContent = 'Destination : ' + year;
      setTimeout(function () {
        flash.classList.add('on');
        setTimeout(function () {
          screen.classList.add('on');
          flash.classList.remove('on');
          video.currentTime = 0;
          var p = video.play();
          if (p && p.catch) p.catch(function () {
            video.muted = true; soundBtn.style.display = 'block';
            video.play().catch(function () {});
          });
        }, 260);
      }, 700);
    });
  }

  function back() {
    screen.classList.remove('on');
    setTimeout(function () { video.pause(); video.removeAttribute('src'); video.load(); }, 900);
    soundBtn.style.display = 'none';
    go.disabled = false; go.classList.remove('pressed'); busy = false;
    hint.textContent = 'Appuie pour repartir dans le temps';
  }

  go.addEventListener('click', launch);
  video.addEventListener('ended', back);
  closeBtn.addEventListener('click', back);
  soundBtn.addEventListener('click', function () { video.muted = false; video.play(); soundBtn.style.display = 'none'; });

  setHands(300, 60);
  showStatic('2026');

  fetch('videos.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      db = {};
      Object.keys(data || {}).forEach(function (k) {
        var y = String(k).trim(); var f = data[k];
        if (/^\d{4}$/.test(y) && +y >= 1986 && +y <= 2026 && typeof f === 'string' && f) db[y] = f;
      });
      years = Object.keys(db).sort();
      if (!years.length) { hint.textContent = 'La machine se recharge… reviens bientôt !'; go.disabled = true; return; }
      hint.textContent = 'Appuie pour remonter le temps';
    })
    .catch(function () { hint.textContent = 'La machine se recharge… reviens bientôt !'; go.disabled = true; });
})();
</script>
</body>
</html>
